name: Supabase Test Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Typ DEPLOY_SUPABASE_TEST om uitsluitend het afgescheiden Supabase-testproject bij te werken"
        required: true
        type: string

  # TIJDELIJKE WORKAROUND:
  # nodig zolang deze nieuwe workflow nog niet op de default branch staat.
  # Na afronding van PR #72 opnieuw beoordelen en bij voorkeur verwijderen.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - ".github/workflows/supabase-test-deploy.yml"
      - "supabase/migrations/**"
      - "supabase/functions/**"

permissions:
  contents: read

concurrency:
  group: supabase-test-deploy
  cancel-in-progress: false

env:
  SUPABASE_TEST_PROJECT_REF: lldmyfvhjypomxfpltlx
  EXPECTED_MIGRATION: supabase/migrations/20260810181000_contentmanager_rbac.sql

jobs:
  validate:
    name: Validate Supabase test deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify manual confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY_SUPABASE_TEST" ]; then
            echo "Ongeldige bevestiging. Typ exact DEPLOY_SUPABASE_TEST."
            exit 1
          fi

      - name: Verify deployment scope
        shell: bash
        run: |
          set -euo pipefail

          test "$SUPABASE_TEST_PROJECT_REF" = "lldmyfvhjypomxfpltlx"
          test -f "$EXPECTED_MIGRATION"

          mapfile -t function_files < <(
            find supabase/functions -type f -name index.ts | sort
          )

          if [ "${#function_files[@]}" -ne 2 ]; then
            echo "Onder supabase/functions worden niet exact twee index.ts-bestanden gevonden."
            printf '%s\n' "${function_files[@]}"
            exit 1
          fi

          expected=(
            "supabase/functions/create-member/index.ts"
            "supabase/functions/resend-member-invite/index.ts"
          )

          for i in "${!expected[@]}"; do
            if [ "${function_files[$i]}" != "${expected[$i]}" ]; then
              echo "Onverwachte Edge Function-bron: ${function_files[$i]}"
              exit 1
            fi
          done

          echo "Deploymentscope bevestigd."

      - name: Verify RBAC migration contract
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "'contentmanager'" "$EXPECTED_MIGRATION"
          grep -Fq "is_current_user_manager" "$EXPECTED_MIGRATION"
          grep -Fq 'Managers can read all profiles' "$EXPECTED_MIGRATION"
          grep -Fq 'Contentmanagers can update member profiles' "$EXPECTED_MIGRATION"
          grep -Fq "protect_contentmanager_profile_update" "$EXPECTED_MIGRATION"

          echo "RBAC-migratiecontract bevestigd."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Validate service-role RBAC contract
        run: node --test tests/supabase-rbac-service-role-contract.test.mjs

      - name: Validate Supabase workflow contract
        run: node --test tests/supabase-workflow-contract.test.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      - name: Check Edge Functions
        shell: bash
        run: |
          deno check --node-modules-dir=auto supabase/functions/create-member/index.ts
          deno check --node-modules-dir=auto supabase/functions/resend-member-invite/index.ts

  preview-test:
    name: Preview Supabase test database migrations
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'o/contentmanager-rbac-contentbeheer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-test

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Verify Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN ontbreekt."
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD ontbreekt."
            exit 1
          fi

      - name: Verify CLI and fixed test target
        shell: bash
        run: |
          set -euo pipefail

          supabase --version

          if [ "$SUPABASE_TEST_PROJECT_REF" != "lldmyfvhjypomxfpltlx" ]; then
            echo "STOP: onverwachte Supabase project-ref."
            exit 1
          fi

          echo "Doelproject bevestigd: $SUPABASE_TEST_PROJECT_REF"

      - name: Link Supabase test project
        run: supabase link --project-ref "$SUPABASE_TEST_PROJECT_REF"

      - name: Preview database migrations
        run: supabase db push --dry-run

  deploy-test:
    name: Deploy to Supabase test

    # TIJDELIJKE PRE-MERGE ROUTE:
    # uitsluitend voor PR #72 en verwijderen vóór de definitieve merge.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'deploy-supabase-test' &&
        github.event.pull_request.number == 72 &&
        github.head_ref == 'o/contentmanager-rbac-contentbeheer' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.sha == '89a2bfb82d723fbad628a0ac64a54691f11e5a90' &&
        github.actor == 'JimGroen2160'
      )
    needs: preview-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-test

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Verify Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN ontbreekt."
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD ontbreekt."
            exit 1
          fi

      - name: Verify CLI and fixed test target
        shell: bash
        run: |
          set -euo pipefail

          supabase --version

          if [ "$SUPABASE_TEST_PROJECT_REF" != "lldmyfvhjypomxfpltlx" ]; then
            echo "STOP: onverwachte Supabase project-ref."
            exit 1
          fi

          echo "Doelproject bevestigd: $SUPABASE_TEST_PROJECT_REF"

      - name: Link Supabase test project
        run: supabase link --project-ref "$SUPABASE_TEST_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy create-member
        run: >
          supabase functions deploy create-member
          --project-ref "$SUPABASE_TEST_PROJECT_REF"
          --use-api

      - name: Deploy resend-member-invite
        run: >
          supabase functions deploy resend-member-invite
          --project-ref "$SUPABASE_TEST_PROJECT_REF"
          --use-api

      - name: Verify deployed functions
        shell: bash
        run: |
          set -euo pipefail

          supabase functions list \
            --project-ref "$SUPABASE_TEST_PROJECT_REF"
