name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:

  playwright:
    name: playwright
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_ADMIN_DISPLAY_NAME: ${{ secrets.TEST_ADMIN_DISPLAY_NAME }}
      TEST_MEMBER_EMAIL: ${{ secrets.TEST_MEMBER_EMAIL }}
      TEST_MEMBER_PASSWORD: ${{ secrets.TEST_MEMBER_PASSWORD }}
      TEST_MEMBER_DISPLAY_NAME: ${{ secrets.TEST_MEMBER_DISPLAY_NAME }}
      TEST_STATUS_MEMBER_EMAIL: ${{ secrets.TEST_STATUS_MEMBER_EMAIL }}
      TEST_STATUS_MEMBER_PASSWORD: ${{ secrets.TEST_STATUS_MEMBER_PASSWORD }}
      TEST_STATUS_MEMBER_DISPLAY_NAME: ${{ secrets.TEST_STATUS_MEMBER_DISPLAY_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required Playwright configuration
        shell: bash
        run: |
          missing=()

          required_variables=(
            TEST_ADMIN_EMAIL
            TEST_ADMIN_PASSWORD
            TEST_ADMIN_DISPLAY_NAME
            TEST_MEMBER_EMAIL
            TEST_MEMBER_PASSWORD
            TEST_MEMBER_DISPLAY_NAME
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              missing+=("$variable_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## Playwright configuration"
              echo
              echo "❌ Verplichte browser- en auth-testconfiguratie ontbreekt."
              echo
              echo "Ontbrekende repository-secrets:"
              for variable_name in "${missing[@]}"; do
                echo "- \`$variable_name\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Verplichte CI-configuratie ontbreekt::Ontbrekende repository-secrets: ${missing[*]}"
            exit 1
          fi

          {
            echo "## Playwright configuration"
            echo
            echo "✅ Verplichte browser- en auth-testconfiguratie is aanwezig."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Validate text encoding
        run: npm run test:encoding

      - name: Run media build and fallback data tests
        id: media-build-tests
        run: npm run test:media-build

      - name: Run Playwright tests
        id: playwright-tests
        run: npx playwright test

      - name: Run media fallback browser tests
        id: media-fallback-tests
        run: npm run test:media-fallback

      - name: Publish Playwright test coverage summary
        if: always()
        shell: bash
        run: |
          playwright_outcome="${{ steps.playwright-tests.outcome }}"
          media_build_outcome="${{ steps.media-build-tests.outcome }}"
          media_fallback_outcome="${{ steps.media-fallback-tests.outcome }}"

          case "$playwright_outcome" in
            success)
              playwright_status="UITGEVOERD / GESLAAGD"
              ;;
            failure)
              playwright_status="UITGEVOERD / GEFAALD"
              ;;
            skipped)
              playwright_status="NIET UITGEVOERD"
              ;;
            *)
              playwright_status="ONBEKENDE STATUS"
              ;;
          esac

          case "$media_build_outcome" in
            success)
              media_build_status="UITGEVOERD / GESLAAGD"
              ;;
            failure)
              media_build_status="UITGEVOERD / GEFAALD"
              ;;
            skipped)
              media_build_status="NIET UITGEVOERD"
              ;;
            *)
              media_build_status="ONBEKENDE STATUS"
              ;;
          esac

          case "$media_fallback_outcome" in
            success)
              media_fallback_status="UITGEVOERD / GESLAAGD"
              ;;
            failure)
              media_fallback_status="UITGEVOERD / GEFAALD"
              ;;
            skipped)
              media_fallback_status="NIET UITGEVOERD"
              ;;
            *)
              media_fallback_status="ONBEKENDE STATUS"
              ;;
          esac

          {
            echo
            echo "## Playwright testdekking"
            echo
            echo "| Testgroep | Automatische PR-CI | Toelichting |"
            echo "|---|---|---|"
            echo "| Algemene website-, accessibility-, login-, logout- en resettests | $playwright_status | Zie de Playwright-job voor het volledige testresultaat. |"
            echo "| Media build- en fallbackdatatests | $media_build_status | Valideert buildgedrag en vijf gevalideerde fallbackfoto's per album. |"
            echo "| Media fallbackbrowsertests | $media_fallback_status | Valideert alle albums, cyclische navigatie, 50 foto-items, accessibility en responsive gedrag op Chromium, Firefox en WebKit. |"
            echo "| Statusmutatie active/inactive met directe backendcontrole | NIET UITGEVOERD | Vereist service-role en afgeschermde testdata. |"
            echo "| Profielbewerking met apart testlid | NIET UITGEVOERD | Profieltest-secrets worden nog niet aan deze workflow aangeboden. |"
            echo "| Pending naar active | NIET UITGEVOERD | Vereist service-role en gedeelde Supabase-testdata. |"
            echo "| Inactive-lid toegang blokkeren | NIET UITGEVOERD | Inactive-testaccount wordt nog niet aan deze workflow aangeboden. |"
            echo "| Nieuw lid uitnodigen en pending profiel aanmaken | OPT-IN / UITGESCHAKELD | Maakt echte Supabase Auth- en profieldata aan. |"
            echo "| Pending lid opnieuw uitnodigen | OPT-IN / UITGESCHAKELD | Kan een echte reset- of uitnodigingsmail versturen. |"
            echo
            echo "**Beveiligingsgrens:** de productie-service-role-key wordt niet beschikbaar gesteld aan automatische pull-requestruns."
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: lighthouse
    needs: playwright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: npm ci

      - name: Build production-like site
        env:
          MEDIA_BUILD_FIXTURE: tests/fixtures/media-cms.json
        run: npm run build

      - name: Validate Lighthouse runner contract
        run: node --test tests/lighthouse-contract.test.mjs

      - name: Resolve Chrome for Lighthouse
        shell: bash
        run: |
          set -euo pipefail

          chrome_candidate=""

          for command_name in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$command_name" >/dev/null 2>&1; then
              chrome_candidate="$(command -v "$command_name")"
              break
            fi
          done

          if [ -z "$chrome_candidate" ]; then
            echo "Geen bruikbare Chrome/Chromium-installatie gevonden."
            exit 1
          fi

          chrome_path="$(realpath "$chrome_candidate")"
          chrome_version="$("$chrome_path" --version)"

          test -x "$chrome_path"
          test -n "$chrome_version"

          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          echo "Chrome path: $chrome_path"
          echo "Chrome version: $chrome_version"

      - name: Start local server
        run: |
          npx http-server dist -p 5500 &
          npx wait-on http://localhost:5500

      - name: Run Lighthouse 13
        run: node scripts/run-lighthouse.mjs

      - name: Validate Lighthouse results
        run: node scripts/check-lighthouse-results.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: test-output/lighthouse
          if-no-files-found: warn
          retention-days: 7

  security:
    name: security
    needs: lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development tooling
        run: npm audit --audit-level=high
