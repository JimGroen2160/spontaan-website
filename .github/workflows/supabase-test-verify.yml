name: Supabase Test Verify

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Typ VERIFY_SUPABASE_TEST_READONLY voor uitsluitend read-only backendcontrole"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-test-verify
  cancel-in-progress: false

jobs:
  validate:
    name: Validate read-only verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify manual confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "VERIFY_SUPABASE_TEST_READONLY" ]; then
            echo "Ongeldige bevestiging. Typ exact VERIFY_SUPABASE_TEST_READONLY."
            exit 1
          fi

      - name: Validate verifier syntax
        run: node --check scripts/testdata/verify-ledenportaal-backend.mjs

      - name: Validate ledenportaal read-only contract
        run: node --test tests/ledenportaal-rbac-contract.test.mjs

  verify-test:
    name: Verify Supabase test backend read-only
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-test

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      TEST_MEMBER_EMAIL: ${{ secrets.TEST_MEMBER_EMAIL }}
      TEST_MEMBER_PASSWORD: ${{ secrets.TEST_MEMBER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_PUBLISHABLE_KEY
            TEST_MEMBER_EMAIL
            TEST_MEMBER_PASSWORD
          )

          for variable_name in "${required[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "Ontbrekende secret/environmentwaarde: $variable_name"
              exit 1
            fi
          done

      - name: Run live read-only backend verification
        run: node scripts/testdata/verify-ledenportaal-backend.mjs
