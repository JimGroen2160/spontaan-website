name: Supabase Testdata

on:
  pull_request:
    paths:
      - ".github/workflows/supabase-testdata.yml"
      - ".env.testdata.example"
      - "scripts/testdata/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Kies ledenportaal of all voor de afgescheiden TEST-testdata"
        required: true
        type: choice
        options:
          - ledenportaal
          - all
      confirm:
        description: "Typ APPLY_LEDENPORTAAL_TESTDATA of APPLY_TESTDATA passend bij de gekozen mode"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-testdata
  cancel-in-progress: false

jobs:
  validate:
    name: Validate testdata tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate script and manifest
        shell: bash
        run: |
          node --check scripts/testdata/seed-test-users.mjs
          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(
            fs.readFileSync("scripts/testdata/manifest.json", "utf8"),
          );
          const script = fs.readFileSync(
            "scripts/testdata/seed-test-users.mjs",
            "utf8",
          );

          if (!Array.isArray(manifest.users) || manifest.users.length !== 7) {
            throw new Error("Het manifest moet exact zeven allowlist-users bevatten.");
          }

          const ids = manifest.users.map((user) => user.id);
          if (new Set(ids).size !== ids.length) {
            throw new Error("De manifest-id's zijn niet uniek.");
          }

          if (!script.includes('--profiles-apply')) {
            throw new Error("--profiles-apply ontbreekt.");
          }

          if (
            /\.from\(["']profiles["']\)[\s\S]{0,300}\.(upsert|delete)\s*\(/.test(
              script,
            )
          ) {
            throw new Error("Onverwachte profile-upsert of delete aangetroffen.");
          }
          NODE

          node --check scripts/testdata/seed-ledenportaal.mjs
          node <<'NODE'
          const fs = require("node:fs");

          const portalDemo = JSON.parse(
            fs.readFileSync("scripts/testdata/ledenportaal-demo.json", "utf8"),
          );
          const portalSeeder = fs.readFileSync(
            "scripts/testdata/seed-ledenportaal.mjs",
            "utf8",
          );

          if (!Array.isArray(portalDemo.songs) || portalDemo.songs.length !== 6) {
            throw new Error("Ledenportaal-demo moet exact zes demoliedjes bevatten.");
          }

          if (!portalDemo.songs.every((song) => song.title.startsWith("[DEMO]"))) {
            throw new Error("Alle demoliedjes moeten herkenbaar met [DEMO] beginnen.");
          }

          if (!Array.isArray(portalDemo.directory) || portalDemo.directory.length !== 3) {
            throw new Error("Ledenportaal-demo moet exact drie smoelenboekmemo's bevatten.");
          }

          if (!portalSeeder.includes("--dry-run") || !portalSeeder.includes("--apply")) {
            throw new Error("Ledenportaal-seeder mist dry-run/apply contract.");
          }

          if (/\.from\(["']profiles["']\)[\s\S]{0,300}\.(insert|upsert|update|delete)\s*\(/.test(portalSeeder)) {
            throw new Error("Ledenportaal-seeder mag profiles niet muteren.");
          }
          NODE

      - name: Verify local environment file is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .env.testdata >/dev/null 2>&1; then
            echo ".env.testdata mag niet door Git worden gevolgd."
            exit 1
          fi

      - name: Verify manual confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          case "$REQUESTED_MODE" in
            ledenportaal)
              expected_confirmation="APPLY_LEDENPORTAAL_TESTDATA"
              ;;
            all)
              expected_confirmation="APPLY_TESTDATA"
              ;;
            *)
              echo "Ongeldige mode: $REQUESTED_MODE"
              exit 1
              ;;
          esac

          if [ "$REQUESTED_CONFIRMATION" != "$expected_confirmation" ]; then
            echo "Ongeldige bevestiging voor mode $REQUESTED_MODE."
            echo "Verwacht exact: $expected_confirmation"
            exit 1
          fi

          echo "Handmatige bevestiging voor mode $REQUESTED_MODE — OK"

  apply-ledenportaal-testdata:
    name: Apply ledenportaal testdata
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ledenportaal'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-test

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_MEMBER_EMAIL: ${{ secrets.TEST_MEMBER_EMAIL }}
      TEST_STATUS_MEMBER_EMAIL: ${{ secrets.TEST_STATUS_MEMBER_EMAIL }}
      TEST_PROFILE_MEMBER_EMAIL: ${{ secrets.TEST_PROFILE_MEMBER_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview ledenportaal demo
        run: node scripts/testdata/seed-ledenportaal.mjs --dry-run

      - name: Apply ledenportaal demo
        run: node scripts/testdata/seed-ledenportaal.mjs --apply

      - name: Verify ledenportaal demo
        shell: bash
        run: |
          output="$(node scripts/testdata/seed-ledenportaal.mjs --dry-run)"
          printf '%s\n' "$output"

          grep -Eq '^[[:space:]]*songs-missing: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*links-missing: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*directory-missing: 0[[:space:]]*$' <<<"$output"

      - name: Verify ledenportaal demo idempotence
        shell: bash
        run: |
          output="$(node scripts/testdata/seed-ledenportaal.mjs --apply)"
          printf '%s\n' "$output"

          grep -Eq '^[[:space:]]*created: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*existing: 13[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*updated: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*failed: 0[[:space:]]*$' <<<"$output"

  apply-testdata:
    name: Apply Supabase testdata
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-test

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_ADMIN_DISPLAY_NAME: ${{ secrets.TEST_ADMIN_DISPLAY_NAME }}
      TEST_MEMBER_EMAIL: ${{ secrets.TEST_MEMBER_EMAIL }}
      TEST_MEMBER_PASSWORD: ${{ secrets.TEST_MEMBER_PASSWORD }}
      TEST_MEMBER_DISPLAY_NAME: ${{ secrets.TEST_MEMBER_DISPLAY_NAME }}
      TEST_MEMBER_PENDING_EMAIL: ${{ secrets.TEST_MEMBER_PENDING_EMAIL }}
      TEST_MEMBER_PENDING_PASSWORD: ${{ secrets.TEST_MEMBER_PENDING_PASSWORD }}
      TEST_MEMBER_PENDING_DISPLAY_NAME: ${{ secrets.TEST_MEMBER_PENDING_DISPLAY_NAME }}
      TEST_MEMBER_INACTIVE_EMAIL: ${{ secrets.TEST_MEMBER_INACTIVE_EMAIL }}
      TEST_MEMBER_INACTIVE_PASSWORD: ${{ secrets.TEST_MEMBER_INACTIVE_PASSWORD }}
      TEST_MEMBER_INACTIVE_DISPLAY_NAME: ${{ secrets.TEST_MEMBER_INACTIVE_DISPLAY_NAME }}
      TEST_STATUS_MEMBER_EMAIL: ${{ secrets.TEST_STATUS_MEMBER_EMAIL }}
      TEST_STATUS_MEMBER_PASSWORD: ${{ secrets.TEST_STATUS_MEMBER_PASSWORD }}
      TEST_STATUS_MEMBER_DISPLAY_NAME: ${{ secrets.TEST_STATUS_MEMBER_DISPLAY_NAME }}
      TEST_PROFILE_MEMBER_EMAIL: ${{ secrets.TEST_PROFILE_MEMBER_EMAIL }}
      TEST_PROFILE_MEMBER_PASSWORD: ${{ secrets.TEST_PROFILE_MEMBER_PASSWORD }}
      TEST_PROFILE_MEMBER_DISPLAY_NAME: ${{ secrets.TEST_PROFILE_MEMBER_DISPLAY_NAME }}
      TEST_CONTENTMANAGER_EMAIL: ${{ secrets.TEST_CONTENTMANAGER_EMAIL }}
      TEST_CONTENTMANAGER_PASSWORD: ${{ secrets.TEST_CONTENTMANAGER_PASSWORD }}
      TEST_CONTENTMANAGER_DISPLAY_NAME: ${{ secrets.TEST_CONTENTMANAGER_DISPLAY_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Auth allowlist
        run: node scripts/testdata/seed-test-users.mjs --apply

      - name: Apply profiles
        run: node scripts/testdata/seed-test-users.mjs --profiles-apply

      - name: Verify profiles
        shell: bash
        run: |
          output="$(node scripts/testdata/seed-test-users.mjs --profiles-dry-run)"
          printf '%s\n' "$output"

          grep -Eq '^[[:space:]]*missing: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*matching: 7[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*different: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*conflict: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*error: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*auth-missing: 0[[:space:]]*$' <<<"$output"

      - name: Verify idempotence
        shell: bash
        run: |
          output="$(node scripts/testdata/seed-test-users.mjs --profiles-apply)"
          printf '%s\n' "$output"

          grep -Eq '^[[:space:]]*aangemaakt: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*bijgewerkt: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*ongewijzigd: 7[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*mislukt: 0[[:space:]]*$' <<<"$output"

      - name: Apply ledenportaal demo
        run: node scripts/testdata/seed-ledenportaal.mjs --apply

      - name: Verify ledenportaal demo
        shell: bash
        run: |
          output="$(node scripts/testdata/seed-ledenportaal.mjs --dry-run)"
          printf '%s\n' "$output"

          grep -Eq '^[[:space:]]*songs-missing: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*links-missing: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*directory-missing: 0[[:space:]]*$' <<<"$output"

      - name: Verify ledenportaal demo idempotence
        shell: bash
        run: |
          output="$(node scripts/testdata/seed-ledenportaal.mjs --apply)"
          printf '%s\n' "$output"

          grep -Eq '^[[:space:]]*created: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*existing: 13[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*updated: 0[[:space:]]*$' <<<"$output"
          grep -Eq '^[[:space:]]*failed: 0[[:space:]]*$' <<<"$output"
