<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="googlebot" content="noindex,nofollow">
  <title>Website in ontwikkeling | Zanggroep Spontaan</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #541879;
      --purple-dark: #35104f;
      --magenta: #d90d87;
      --surface: #ffffff;
      --text: #2e2333;
      --muted: #675d6c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(217, 13, 135, 0.20),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          var(--purple-dark),
          var(--purple)
        );
    }

    main {
      width: min(760px, 100%);
      padding: clamp(34px, 7vw, 68px);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(22, 8, 32, 0.30);
      text-align: center;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 22px;
      border-radius: 50%;
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--magenta)
        );
      font-size: 38px;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--magenta);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--purple-dark);
      font-size: clamp(2rem, 6vw, 3.65rem);
      line-height: 1.06;
    }

    .intro {
      max-width: 580px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.5vw, 1.24rem);
      line-height: 1.7;
    }

    .closing {
      margin: 28px 0 0;
      color: var(--purple);
      font-weight: 700;
    }
    .contact {
      margin: 18px 0 0;
      color: var(--muted);
    }

    .contact a {
      color: var(--purple);
      font-weight: 700;
    }

    footer {
      margin-top: 38px;
      padding-top: 24px;
      border-top: 1px solid #ece6ef;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      main {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">&#9835;</div>

    <p class="eyebrow">Zanggroep Spontaan</p>

    <h1>Spontaan krijgt een nieuwe website</h1>

    <p class="intro">
      Achter de schermen werken we aan onze nieuwe website.
      Binnenkort vind je hier alles over Zanggroep Spontaan.
    </p>

    <p class="closing">
      Graag tot binnenkort!
    </p>
    <p class="contact">
      Vragen? Mail ons via
      <a href="mailto:spontaaninfo@gmail.com">spontaaninfo@gmail.com</a>
    </p>

    <footer>
      Zanggroep Spontaan - Angerlo
    </footer>
  </main>
</body>
</html>
